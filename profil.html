<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>ENI - Memory</title>
</head>
<body class="row justify-content-center">
    <h1 class="text-center">ENI - <strong>Memory</strong> - Profil</h1>
    <nav class="navbar bg-dark d-flex justify-content-evenly rounded-3 m-1 m-lg-5 col-11 col-lg-6">
        <a href="index.html" class="text-light text-decoration-none">Accueil</a>
        <a href="inscription.html" class="text-light text-decoration-none">S'inscrire</a>
        <a href="connexion.html" class="text-light text-decoration-none">Se connecter</a>
        <a href="profil.html" class="text-light text-decoration-none">Profil</a>
        <a href="jeu.html" class="text-light text-decoration-none">Jouer</a>
    </nav>
    <section class="border border-black rounded-3 bg-dark text-light text-center m-1 m-lg-5 p-1 p-lg-5 col-11 col-lg-8">
        <h2>Profil</h2>
        <img class="d-block my-4 mx-auto" src="ressources\question.svg" alt="Image de profil" width="100"/>
        <p>Nom d'utilisateur : <span id="pseudo2"></span></p>
        <p>Email : <span id="email2"></span></p>
        <h6>Taille du plateau</h6>
        <div class="my-2">
            <input type="radio" name="size" id="4x3" />
            <label for="4x3">4x3</label>
            <input type="radio" name="size" id="4x4" />
            <label for="4x4">4x4</label>
            <input type="radio" name="size" id="4x5" />
            <label for="4x5">4x5</label>
        </div>
        <h6>Type d'images</h6>
        <div class="my-2">
            <input type="radio" name="type" id="legumes" />
            <label for="legumes">Légumes</label>
            <input type="radio" name="type" id="animaux" />
            <label for="animaux">Animaux</label>
            <input type="radio" name="type" id="sport" />
            <label for="sport">Sport</label>
        </div>       
    </section>
    <script src="javascript/profil.js" defer></script>
</body>
</html>
