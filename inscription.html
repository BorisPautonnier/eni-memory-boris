<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENI - Memory</title>
</head>
<body>
    <h1>ENI - <strong>Memory</strong> - Inscription</h1>
    <nav>
        <a href="index.html">Accueil</a>
        <a href="inscription.html">S'inscrire</a>
        <a href="connexion.html">Se connecter</a>
        <a href="profil.html">Profil</a>
        <a href="jeu.html">Jouer</a>
    </nav>
    <fieldset>
        <h2>Inscrivez-vous</h2>>
        <form action="" method="get">
            <label for="nom">Nom d'utilisateur</label>
            <input type="text" id="nom" name="nom" autofocus placeholder="3 caractères minimum" required pattern="{3,}" title="Saisissez votre pseudo">
            <label for="email">Entrez votre email</label>
            <input type="email" id="email" name="email" placeholder="Votre email" title="Saisissez votre email">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" placeholder="Votre mot de passe"required title="Saisissez votre mot de passe">
            <label for="password_confirm">Confirmez le mot de passe</label>
            <input type="password" id="password_confirm" name="password_confirm" placeholder="Confirmez votre mot de passe" required title="Saisissez votre mot de passe">
            <button type="submit">Création du compte</button>
            <button type="reset">Annuler</button>
        </form>
    </fieldset>
</body>
</html>
