<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <title>ENI - Memory</title>
</head>
<body class="row justify-content-center">
    <h1 class="text-center">ENI - <strong>Memory</strong> - Inscription</h1>
    <nav class="navbar bg-dark d-flex justify-content-evenly rounded-3 m-1 m-lg-5 col-11 col-lg-6">
        <a href="index.html" class="text-light text-decoration-none">Accueil</a>
        <a href="inscription.html" class="text-light text-decoration-none">S'inscrire</a>
        <a href="connexion.html" class="text-light text-decoration-none">Se connecter</a>
        <a href="profil.html" class="text-light text-decoration-none">Profil</a>
        <a href="jeu.html" class="text-light text-decoration-none">Jouer</a>
    </nav>
    <section class="border border-black rounded-3 bg-dark text-light text-center m-1 m-lg-5 p-1 p-lg-5 col-11 col-lg-8">
        <h2>Inscrivez-vous</h2>
        <form id="formInscription" class="d-flex flex-column" action="" method="get">
            <div class="m-1">
                <label for="pseudo" class="col-4 text-end">Nom d'utilisateur</label>
                <input class="col-7" type="text" id="pseudo" name="pseudo" autofocus placeholder="3 caractères minimum" required pattern=".{3,}$" title="Saisissez votre pseudo">
            </div>
            <div class="m-1">
                <label for="email" class="col-4 text-end">Entrez votre email</label>
                <input class="col-7" type="email" id="email" name="email" placeholder="Votre email" required title="Saisissez votre email">
            </div>
            <div class="m-1">
                <label for="password" class="col-4 text-end">Mot de passe</label>
                <input class="col-7" type="password" id="password" name="password" placeholder="Votre mot de passe" required title="Saisissez votre mot de passe" pattern="^(?=.*[A-Za-z])(?=.*\d)(?=.*[^a-zA-Z0-9À-ÖØ-öø-ÿ])[^\s]{6,}$">
                <div class="d-flex flex-row justify-content-center text-black text-center">
                    <div id="faible" class="m-1 bg-danger invisible">Faible</div>
                    <div id="moyen" class="m-1 bg-warning invisible">Moyen</div>
                    <div id="fort" class="m-1 bg-success invisible">Fort</div>
                </div>
            </div>
            <div class="m-1">
                <label for="passwordConfirm" class="col-4 text-end">Confirmez le mot de passe</label>
                <input class="col-7" type="password" id="passwordConfirm" name="passwordConfirm" placeholder="Confirmez votre mot de passe" required title="Saisissez votre mot de passe">
                <div class="d-flex justify-content-center text-black text-center">
                    <div id="passwordConfirmControl" class="m-1 bg-success invisible">Bien identique au mot de passe</div>
                </div>
            </div>
            <div class="m-1">
                <button class="btn btn-success" type="submit">Création du compte</button>
                <button class="btn btn-danger" type="reset">Annuler</button>
            </div>
        </form>
        <div>
            <h5>Consignes du mot de passe :</h5>
            <p id="lettre">Doit comporter une lettre</p>
            <p id="chiffre">Doit comporter un chiffre</p>
            <p id="special">Doit comporter un caractère spécial</p>
            <p id="nbCaracteres">Doit faire au minimum 6 caractères</p>
        </div>
    </section>
    <script src="javascript/inscription.js" defer></script>
</body>
</html>
